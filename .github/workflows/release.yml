# Release tags (v*) are maintained exclusively on the `release` branch:
# its history is a linear record of tagged release versions. `main` carries
# only development history (no Release commits). Pushing a v* tag triggers
# this build regardless of which branch it is created on.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      ARCH_NAME: uvman-${{ github.ref_name }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ARCH_NAME"
          cp "target/${{ matrix.target }}/release/uvman" "$ARCH_NAME/uvman"
          tar -czf "$ARCH_NAME.tar.gz" "$ARCH_NAME"
          sha256sum "$ARCH_NAME.tar.gz" > "$ARCH_NAME.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:ARCH_NAME -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/uvman.exe" "$env:ARCH_NAME/uvman.exe"
          Compress-Archive -Path "$env:ARCH_NAME/uvman.exe" -DestinationPath "$env:ARCH_NAME.zip"
          (Get-FileHash -Algorithm SHA256 "$env:ARCH_NAME.zip").Hash.ToLower() `
            | Out-File -Encoding ascii "$env:ARCH_NAME.zip.sha256"

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256