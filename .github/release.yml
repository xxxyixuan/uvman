# Config for automatically generated release notes (GitHub official mechanism).
# Used by `generate_release_notes: true` in .github/workflows/release.yml and
# by the "Generate release notes" button in the GitHub UI.
#
# Conventions (see .tmp/github-release-notes-template.md):
# - Release title MUST be the bare version tag, e.g. "v0.1.1" (the GitHub
#   default when the release is auto-generated from a tag).
# - PR summary sections follow the template structure:
#   新增特性 / 优化与改进 / Bug 修复 / 破坏性变更.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: 新增特性
      labels:
        - feat
        - enhancement
    - title: 优化与改进
      labels:
        - refactor
        - perf
        - docs
        - chore
    - title: Bug 修复
      labels:
        - fix
        - bug
    - title: 破坏性变更
      labels:
        - breaking
