[package]
name = "uvman"
version = "0.1.0"
edition = "2024"
authors = ["yixuan <https://github.com/xxxyixuan>"]

[dependencies]
clap = { version = "4", features = ["env", "derive", "string"] }
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
indoc = "2"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
url = "2.5.8"
versions = "7.0"
tempfile = "3.27"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.5"
tempfile = "3.8"