[package]
name = "uvman"
version = "0.3.5"
edition = "2024"
authors = ["yixuan <https://github.com/xxxyixuan>"]
description = "A generic development-tool version manager CLI, written in Rust"
homepage = "https://github.com/xxxyixuan/uvman"
repository = "https://github.com/xxxyixuan/uvman"
license = "MIT"
publish = false

default-run = "uvman"

[lib]
name = "uvman"
path = "src/lib.rs"

[[bin]]
name = "uvman"
path = "src/main.rs"

[[bin]]
name = "uvman-shim"
path = "src/bin/uvman-shim.rs"

[dependencies]
clap = { version = "4", features = ["env", "derive", "string", "wrap_help"] }
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
indoc = "2"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
toml = "1"
url = "2.5.8"
versions = "8.0"
tempfile = "3.27"
futures-util = "0.3"
flate2 = "1"
indicatif = "0.18"
regex = "1"
sha2 = "0.11"
tar = "0.4"
zip = "8"
ratatui = "0.30.2"
ratatui-crossterm = "0.1.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.8"

[target.'cfg(windows)'.dependencies]
# User PATH lives in HKCU\Environment; winreg reads/writes it type-faithfully
winreg = "0.56.0"
# WM_SETTINGCHANGE broadcast so already-running apps pick up the new PATH
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# Size first: `uvman-shim` is copied once per managed command (~30 copies), so
# every byte saved here is multiplied across the whole shims/ dir. The main
# binary is shipped once but benefits from the same settings.
opt-level = "z" # size over speed; switch to "s"/3 if install throughput matters more
lto = true # whole-program LTO: lets the linker drop unused dependency code
codegen-units = 1 # one CGU so LTO/dead-code analysis sees the whole crate
strip = true # drop the symbol table from the shipped binaries
