[package]
name = "uvman"
version = "0.1.3"
edition = "2024"
authors = ["yixuan <https://github.com/xxxyixuan>"]
description = "A generic development-tool version manager CLI, written in Rust"
homepage = "https://github.com/xxxyixuan/uvman"
repository = "https://github.com/xxxyixuan/uvman"
license = "MIT"
# 仅通过 GitHub Release 分发，不发布到 crates.io
publish = false

[[bin]]
name = "uvman"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["env", "derive", "string"] }
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
indoc = "2"
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
toml = "1"
url = "2.5.8"
versions = "7.0"
tempfile = "3.27"
futures-util = "0.3"
flate2 = "1"
indicatif = "0.18"
regex = "1"
sha2 = "0.11"
tar = "0.4"
zip = "8"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3.8"
