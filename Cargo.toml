[package]
name = "uvman"
version = "0.1.0"
edition = "2024"
authors = ["yixuan <https://github.com/xxxyixuan>"]

[dependencies]
clap = { version = "4", features = ["env", "derive", "string"] }
color-eyre = "0.6"
console = "0.16"
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
indoc = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
versions = "7.0.0"
